# Pruebas de cada cambio.
name: Integración continua

# Una corrida por commit.
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  # Para quien lo reutilice.
  workflow_call:

# Cancela la corrida vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura.
permissions:
  contents: read

env:
  GITLEAKS: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  # 1. Seguridad; si falla, se detiene.
  security:
    name: Seguridad (secretos, composer.json, dependencias y archivo publicado)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Historial completo.
      - name: Bajar el código con su historial
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Buscar secretos
        run: |
          archivo=gitleaks_${GITLEAKS}_linux_x64.tar.gz
          curl -fsSLO "https://github.com/gitleaks/gitleaks/releases/download/v$GITLEAKS/$archivo"
          echo "$GITLEAKS_SHA256  $archivo" | sha256sum -c
          tar -xzf "$archivo" gitleaks
          ./gitleaks git --redact --no-banner
      - name: Preparar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
      - name: Validar composer.json
        run: composer validate --strict
      # Keep a Changelog, con la sección de lo próximo a publicar.
      - name: Revisar el CHANGELOG
        run: grep -qx '## \[Sin publicar\]' CHANGELOG.md
      # Lo que descarga Composer, sin lo de desarrollo.
      - name: Revisar el archivo publicado
        run: |
          git archive HEAD | tar -t > contenido.txt
          for requerido in composer.json LICENSE README.md src/ config/ routes/ database/; do
            grep -qx "$requerido" contenido.txt || { echo "Falta $requerido"; exit 1; }
          done
          if grep -E '^((tests|\.github|docs|\.claude)/|CLAUDE\.md$)' contenido.txt; then
            echo "El archivo publicado lleva carpetas de desarrollo"; exit 1
          fi
      # El paquete no versiona el lock.
      - name: Resolver dependencias
        run: composer update --no-install --no-interaction --no-progress
      # Alto o crítico falla.
      - name: Auditar paquetes de PHP
        run: composer audit --locked

  # 2. Pruebas por versión soportada.
  backend-tests:
    name: Backend pruebas (PHP ${{ matrix.php }} con Laravel ${{ matrix.laravel }}${{ matrix.lowest && ', mínimas' || '' }})
    needs: security
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - { php: '8.2', laravel: '12', testbench: '10', lowest: true }
          - { php: '8.3', laravel: '12', testbench: '10' }
          - { php: '8.3', laravel: '13', testbench: '11' }
          - { php: '8.5', laravel: '13', testbench: '11' }
    steps:
      - name: Bajar el código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite
          coverage: none
      # Sin lock, según composer.json.
      - name: Recuperar la caché de Composer
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.cache/composer/files
          key: composer-${{ matrix.php }}-${{ matrix.laravel }}-${{ hashFiles('composer.json') }}
          restore-keys: composer-${{ matrix.php }}-${{ matrix.laravel }}-
      - name: Fijar Laravel ${{ matrix.laravel }}
        run: |
          composer require "illuminate/support:^${{ matrix.laravel }}.0" --no-update
          composer require --dev "orchestra/testbench:^${{ matrix.testbench }}.0" --no-update
      - name: Instalar dependencias
        run: composer update --prefer-dist --no-interaction --no-progress ${{ matrix.lowest && '--prefer-lowest' || '' }}
      - name: Correr las pruebas
        run: composer test
