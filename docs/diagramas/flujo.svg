        <title id="flujo-title">Cómo conecta SSO una app con su central</title>
        <desc id="flujo-desc">El navegador entra por la app satélite, que inicia sesión con la central por OAuth2, recibe sus webhooks, la llama de servidor a servidor y guarda el índice de sesiones en Redis.</desc>
